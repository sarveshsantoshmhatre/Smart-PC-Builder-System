name: Validate Smart PC Builder

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate JavaScript syntax
        run: node --check app.js
      - name: Validate cloud AI client syntax
        run: node --check puter-ai.js
      - name: Validate Puter Worker syntax
        run: node --check worker/index.js

      - name: Verify required web files
        run: |
          test -s index.html
          test -s styles.css
          test -s app.js
